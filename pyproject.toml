[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "toktop"
dynamic = ["version"]
description = "Token usage across your AI coding tools (Claude Code, opencode, zcode…), in a terminal dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "xlydevs" }]
keywords = ["tokens", "llm", "claude-code", "opencode", "tui", "textual", "usage", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = ["textual>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
toktop = "toktop.cli:main"

[project.urls]
Homepage = "https://github.com/xlydevs/toktop"
Issues = "https://github.com/xlydevs/toktop/issues"

[tool.hatch.version]
path = "src/toktop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/toktop"]

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E701", "E702", "E731", "B905", "UP015"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"src/toktop/i18n.py" = ["E501"]
"src/toktop/onboard.py" = ["E501"]
